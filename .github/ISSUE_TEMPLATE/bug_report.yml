name: Bug report
description: Tell me about a reproducible problem in LibreLeaf.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve LibreLeaf. Please do not include secrets or personal data.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Explain what you expected and what happened instead.
      placeholder: I expected… but LibreLeaf…
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can I reproduce it?
      description: Include the search terms and steps, but do not attach copyrighted files.
      placeholder: |
        1. Search for…
        2. Select…
        3. See…
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Safari 18 on iPhone, Firefox 132 on Windows, etc.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots, console output, or related links if useful. Remove private information first.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues for this problem.
          required: true
        - label: I have not included credentials, personal data, or copyrighted book files.
          required: true
