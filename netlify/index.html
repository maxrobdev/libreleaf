<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LibreLeaf — Open-access book resolver</title>
    <meta
      name="description"
      content="Search open book catalogues and compare source-labelled download, read and borrow routes with clear rights context for UK readers."
    />
    <meta
      name="keywords"
      content="free books UK, open access book resolver, book availability search, Project Gutenberg search, Open Library books, download EPUB"
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://libreleaf-books.netlify.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:site_name" content="LibreLeaf" />
    <meta property="og:url" content="https://libreleaf-books.netlify.app/" />
    <meta property="og:title" content="LibreLeaf — Open-access book resolver" />
    <meta property="og:description" content="Resolve books across open catalogues with provenance and rights context." />
    <meta property="og:image" content="https://libreleaf-books.netlify.app/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LibreLeaf — Open-access book resolver" />
    <meta name="twitter:description" content="Resolve books across open catalogues with provenance and rights context." />
    <meta name="twitter:image" content="https://libreleaf-books.netlify.app/og.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "LibreLeaf",
        "url": "https://libreleaf-books.netlify.app/",
        "description": "Resolve books across open catalogues and compare source-labelled access routes with rights context.",
        "inLanguage": "en-GB",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://libreleaf-books.netlify.app/?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
